<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="contorls-div">
      <div class="inputs">
        <label for="bar-count">Bar Count</label>
        <input
          type="range"
          min="10"
          max="100"
          value="20"
          name="bar-count"
          id="bar-input"
        />
        <input type="number" id="count-val" value="20" />
        <label for="Animation-Speed">Animation Speed</label>
        <input
          type="range"
          min="1"
          step="1"
          value="2"
          max="10"
          name="Animation-Speed"
          id="speed-input"
        />
        <input type="number" id="speed-val" value="2" />
      </div>
      <div class="btns">
        <button type="button" id="Bubble-Sort">Bubble Sort</button>
        <button type="button" id="Selection-Sort">Selection Sort</button><br />
        <button type="button" id="Insertion-Sort">Insertion Sort</button>
        <button type="button" id="Merge-Sort">Merge Sort</button>
      </div>
    </div>
    <div class="bars" id="bars">
      
    </div>
    <script src="index.js"></script>
  </body>
</html>
