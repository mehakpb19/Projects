<!doctype html>
<html lang="en">
  <head>

  <body>
    <div class="contorls-div">
      <div class="inputs">
              <label for="bar-count">Bar Count</label>
      <input type="range" min="10" max="100" value="20" name="bar-count" id="bar-input" >
      <input type="number" id="count-val" value="20">
      <label for="Animation-Speed">Animation Speed</label>
      <input type="range" min="0.1" step="0.1" value="0.1" max="1" name="Animation-Speed" id="speed-input">
      <input type="number" id="speed-val" value="1">
      </div>
      <div class="btns">
        <button type="button" id="Bubble-Sort">Bubble Sort</button>
        <button type="button" id="Selection-Sort">Selection Sort</button><br>
        <button type="button" id="Insertion Sort">Insertion Sort</button>
        <button type="button" id="Merge Sort">Merge Sort</button>
      </div>
    </div>

  </body>
</html>
