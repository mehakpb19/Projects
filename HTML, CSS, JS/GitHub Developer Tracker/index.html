<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Developer Tracker</title>
    <link rel="icon" type="image/png" href="github.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 style="color: #38BDF8; margin: auto;">GitHub Tracker</h1>
        <input type="text" placeholder="Enter the Github Username...">
    </header>
    <main>
        <div class="profile">
            <img src="https://i.pinimg.com/control1/736x/b0/49/e8/b049e8fe7c346bc8090515a8f9132397.jpg" alt="No Profile pic Found" class="profile-pic">
            <h1>name</h1>
            <p>Bio</p>
            <div class="container">
                <div ><h4>0</h4>Following</div>
                <div ><h4>0</h4>Followers</div>
                <div ><h4>0</h4>Repos</div>
            </div>
            <h4>Latest Repos</h4>
            <hr>
            <button type="button">f</button>
            <button type="button">s</button>
            <button type="button">t</button>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
